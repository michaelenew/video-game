[workspace]
resolver = "3"
members = ["crates/sim", "crates/net", "crates/view", "crates/anim",
    "crates/manual", "crates/game", "crates/web", "crates/hunt",
    "crates/look", "crates/sound", "crates/regions"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

# Determinism: the simulation must produce bit-identical results on every
# machine. Contraction (fusing a*b+c into an FMA) is a per-target codegen
# decision, so it is disabled workspace-wide as a belt-and-braces measure.
# The real defence is that `sim` uses no floating point at all -- see
# docs/design/architecture.md.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The browser builds: small and fast matters more than compile time.
#
# `s` rather than `z`: the page is single-threaded, so every millisecond of
# Bevy's own machinery is on the frame, and `z` gives up inlining to save
# bytes. Measured 2026-10-21 on the proving ground (`docs/design/web.md`,
# "What a browser frame costs"): the page's own work a frame went from 15.8
# ms to 12.9 ms for 5% more download; `3` was 12.0 ms for about a quarter more.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

# Build scripts at full speed: `crates/game/build.rs` draws the brush strokes,
# which is a second optimised and most of a minute not.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3
