# TEMPORARY: runs the launchers on real Mac and Windows machines. Removed
# before merging.
name: Launcher test

on:
  push:
    branches: [claude/nifty-carson-xk0p8w]

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Zip it as the release does, unzip it as Archive Utility does
        run: |
          chmod +x scripts/play-macos.command
          (cd scripts && zip -q ../play-macos.zip play-macos.command)
          mkdir "$RUNNER_TEMP/dl"
          ditto -x -k play-macos.zip "$RUNNER_TEMP/dl"
          ls -l "$RUNNER_TEMP/dl"
          test -x "$RUNNER_TEMP/dl/play-macos.command"
      - name: Run it from outside a checkout, with no Rust installed
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          unset CARGO_HOME RUSTUP_HOME
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '\.cargo' | paste -sd: -)"
          command -v rustup || echo "rustup hidden"
          "$RUNNER_TEMP/dl/play-macos.command" --profile --quit-after 20 < /dev/null 2>&1 | tee "$RUNNER_TEMP/log.txt" || true
          grep -q "Checking for Rust" "$RUNNER_TEMP/log.txt"
          grep -q "Running \`" "$RUNNER_TEMP/log.txt"

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run it from outside a checkout
        shell: pwsh
        run: |
          Copy-Item scripts\play-windows.cmd $env:RUNNER_TEMP
          cmd /c "$env:RUNNER_TEMP\play-windows.cmd" --profile --quit-after 20 2>&1 | Tee-Object "$env:RUNNER_TEMP\log.txt"
          "launcher exit code: $LASTEXITCODE"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log.txt" -Pattern 'Running `' -Quiet)) { exit 1 }
          exit 0
