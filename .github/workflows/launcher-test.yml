# TEMPORARY: checks the launchers hand over to the copy they pulled. Removed
# before merging. A stand-in cargo prints what it was asked instead of building.
name: Launcher test

on:
  push:
    branches: [claude/nifty-carson-xk0p8w]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.cargo/bin"
          printf '#!/bin/sh\necho "stand-in cargo: $*"\n' > "$HOME/.cargo/bin/cargo"
          chmod +x "$HOME/.cargo/bin/cargo"
          export PATH="$HOME/.cargo/bin:$PATH"
          git clone -q -b "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" "$HOME/video-game"
          git -C "$HOME/video-game" reset -q --hard HEAD~1
          cp scripts/play-macos.command "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/play-macos.command" --hello world < /dev/null 2>&1 | tee "$RUNNER_TEMP/log.txt"
          test "$(grep -c 'Handing over' "$RUNNER_TEMP/log.txt")" = 1
          grep -q 'Fast-forward' "$RUNNER_TEMP/log.txt"
          grep -q 'Playing the checkout this launcher is in' "$RUNNER_TEMP/log.txt"
          grep -q 'stand-in cargo: run --release -p game -- --hello world' "$RUNNER_TEMP/log.txt"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake'
          New-Item -ItemType Directory $fake | Out-Null
          Set-Content (Join-Path $fake 'cargo.cmd') '@echo stand-in cargo: %*'
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$fake;$machine", 'Machine')
          $game = Join-Path $env:USERPROFILE 'video-game'
          git clone -q -b $env:GITHUB_REF_NAME "https://github.com/$env:GITHUB_REPOSITORY.git" $game
          git -C $game reset -q --hard HEAD~1
          Copy-Item scripts\play-windows.cmd $env:RUNNER_TEMP
          $log = Join-Path $env:RUNNER_TEMP 'log.txt'
          cmd /c "$env:RUNNER_TEMP\play-windows.cmd" --hello world 2>&1 | Tee-Object $log
          "launcher exit code: $LASTEXITCODE"
          $text = Get-Content $log -Raw
          if (([regex]::Matches($text, 'Handing over')).Count -ne 1) { 'handed over other than once'; exit 1 }
          if ($text -notmatch 'Fast-forward') { 'did not pull'; exit 1 }
          if ($text -notmatch 'Playing the checkout this launcher is in') { 'the pulled copy did not play'; exit 1 }
          if ($text -notmatch 'stand-in cargo: run --release -p game -- --hello world') { 'cargo not run as expected'; exit 1 }
          exit 0
