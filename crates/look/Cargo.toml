[package]
name = "look"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The art direction, with no engine in it -- the same arrangement `view` has
# for presentation logic. Everything here is a pure function from a handful of
# numbers to a colour, so it can be looked at, tested and iterated on without
# launching a game, which is the whole point: the cost that matters is the
# *next* arena, not these ones.
[dependencies]
sim = { path = "../sim" }
