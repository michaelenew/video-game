[package]
name = "net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ggrs = { version = "0.11.1", features = ["sync-send"] }
sim = { path = "../sim" }

# `ggrs` plugs in here. It is not vendored yet because this environment cannot
# reach crates.io; add it when working locally:
#
#   ggrs = "0.10"
#
# `Rollback` below is deliberately shaped like the GGRS session handler
# (advance / save / load / checksum), so wiring it up is an impl block rather
# than a redesign.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# GGRS ships a SyncTest session that replays with forced rollbacks and compares
# its own checksums. It is the standard way to catch non-determinism, and it is
# stricter than the hand-rolled harness in tests/rollback.rs.
