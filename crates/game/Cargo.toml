[package]
name = "game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The hub re-runs the animation solver on every edit, so a change can be seen
# on a real fighter immediately. Nothing in a shipped frame calls it.
anim = { path = "../anim" }
hunt = { path = "../hunt" }
manual = { path = "../manual" }
sim = { path = "../sim" }
net = { path = "../net" }
view = { path = "../view" }

# Default features minus the ones a 3D arena prototype does not need. Keeps
# compile times down without giving up rendering, glTF or PBR.
bevy = { version = "0.16", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_render", "bevy_scene", "bevy_window", "bevy_winit", "multi_threaded", "tonemapping_luts", "x11", "bevy_ui", "bevy_text", "bevy_gizmos", "default_font"] }
bevy_egui = { version = "0.34", default-features = false, features = ["render", "bevy_picking", "default_fonts"] }
