[package]
name = "game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The hub re-runs the animation solver on every edit, so a change can be seen
# on a real fighter immediately. Nothing in a shipped frame calls it.
anim = { path = "../anim" }
hunt = { path = "../hunt" }
manual = { path = "../manual" }
# The peer, on both platforms: UDP to a typed-in address on a desktop, a room
# on a public broker and a WebRTC line in a browser. `net` holds both, behind
# one `Rendezvous`; `src/online.rs` picks.
net = { path = "../net" }
sim = { path = "../sim" }
view = { path = "../view" }

# Default features minus the ones a 3D arena prototype does not need. Keeps
# compile times down without giving up rendering, glTF or PBR.
#
# The two platform blocks below add to this list rather than replacing it:
# Cargo unions the features of a dependency declared more than once, which is
# how one crate builds for a window and for a canvas.
bevy = { version = "0.16", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_render", "bevy_scene", "bevy_window", "bevy_winit", "tonemapping_luts", "bevy_ui", "bevy_text", "bevy_gizmos", "default_font"] }
bevy_egui = { version = "0.34", default-features = false, features = ["render", "bevy_picking", "default_fonts"] }

# On a desktop: an X11 window, and threads to schedule systems across.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.16", default-features = false, features = ["x11", "multi_threaded"] }

# In a browser: WebGL 2 rather than WebGPU, because WebGL 2 is everywhere and
# WebGPU is not yet -- a link that only works in one browser is not a link you
# can send to somebody. No `multi_threaded`: wasm threads need cross-origin
# isolation headers, which GitHub Pages does not send.
#
# `web-sys` is here for the four browser facts the game needs and Bevy does
# not hand over: the query string, local storage, somewhere to print a panic,
# and somewhere to say how meeting the other player is going. See
# `src/platform.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.16", default-features = false, features = ["webgl2"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "Storage", "Window", "console"] }
