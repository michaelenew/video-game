[package]
name = "sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# NO DEPENDENCIES. This is load-bearing, not an accident.
#
# Every dependency is a determinism risk: unstable iteration order, floating
# point, platform-conditional code paths. The simulation is a pure function of
# (state, inputs) and owns all of its own math. Adding a dependency here needs
# a very good reason and a determinism argument.
[dependencies]

# `lab`: a species can be installed at runtime in place of the compiled one,
# for the topology experiments (`crates/lab`, outside the workspace). Off in
# every build the game, the tests and the tools make.
[features]
lab = []
